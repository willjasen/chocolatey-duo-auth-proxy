name: Check Duo Authentication Proxy update

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      DUO_UPDATE_WEBHOOK_URL: ${{ secrets.DUO_UPDATE_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Check for a newer Duo Authentication Proxy release
        shell: pwsh
        run: ./scripts/Check-DuoAuthProxyUpdate.ps1 -WebhookUrl $env:DUO_UPDATE_WEBHOOK_URL -ApplyUpdate

      - name: Create package update pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Update Duo Authentication Proxy package
          title: Update Duo Authentication Proxy package
          body: |
            Updates the Chocolatey package to the latest Duo Authentication Proxy Windows release.

            The installer URL and SHA-256 checksum were read from Duo's published checksums page.
          branch: automation/duo-auth-proxy-update
          delete-branch: true
