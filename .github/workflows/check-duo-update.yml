name: Check Duo Authentication Proxy update

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      DUO_UPDATE_WEBHOOK_URL: ${{ secrets.DUO_UPDATE_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Check for a newer Duo Authentication Proxy release
        shell: pwsh
        run: ./scripts/Check-DuoAuthProxyUpdate.ps1 -WebhookUrl $env:DUO_UPDATE_WEBHOOK_URL
