name: Check Duo Authentication Proxy update

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chocolatey-publish
  cancel-in-progress: false

jobs:
  check:
    runs-on: windows-latest
    env:
      DUO_UPDATE_WEBHOOK_URL: ${{ secrets.DUO_UPDATE_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Check for a newer Duo Authentication Proxy release
        id: update
        shell: pwsh
        run: ./scripts/Check-DuoAuthProxyUpdate.ps1 -WebhookUrl $env:DUO_UPDATE_WEBHOOK_URL -ApplyUpdate

      - name: Pack Chocolatey package
        if: steps.update.outputs.update_available == 'true'
        shell: pwsh
        run: choco pack duo-auth-proxy.nuspec --outputdirectory packages

      - name: Validate updated package
        if: steps.update.outputs.update_available == 'true'
        shell: pwsh
        run: ./tests/run-tests.ps1

      - name: Publish updated package
        if: steps.update.outputs.update_available == 'true'
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: ./scripts/Publish-ChocolateyPackage.ps1 -Version '${{ steps.update.outputs.version }}'

      - name: Record published version
        if: steps.update.outputs.update_available == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add duo-auth-proxy.nuspec tools/chocolateyinstall.ps1
          git commit -m "Update Duo Authentication Proxy package to ${{ steps.update.outputs.version }}" -m "Co-authored-by: Copilot App <223556219+Copilot@users.noreply.github.com>"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to commit the published package version.' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Package submitted, but updating main failed. Check branch protection permissions before retrying.' }
